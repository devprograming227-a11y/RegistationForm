<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Todo List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      width: min(520px, 90%);
      padding: 24px;
    }
    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      color: #333;
    }
    form {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      background: #0078d4;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #005a9e;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafafa;
      padding: 12px 14px;
      border: 1px solid #e2e2e2;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    li.completed span {
      text-decoration: line-through;
      color: #777;
    }
    .item-actions {
      display: flex;
      gap: 8px;
    }
    .item-actions button {
      background: #e1e1e1;
      color: #333;
    }
    .item-actions button.remove {
      background: #ea4c4c;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>JavaScript Todo List</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="Add a new task..." autocomplete="off" />
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
  </div>
  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    let todos = [];

    function renderTodos() {
      list.innerHTML = '';
      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        li.className = todo.completed ? 'completed' : '';

        const text = document.createElement('span');
        text.textContent = todo.text;

        const actions = document.createElement('div');
        actions.className = 'item-actions';

        const toggleButton = document.createElement('button');
        toggleButton.textContent = todo.completed ? 'Undo' : 'Complete';
        toggleButton.addEventListener('click', () => toggleTodo(index));

        const removeButton = document.createElement('button');
        removeButton.textContent = 'Remove';
        removeButton.className = 'remove';
        removeButton.addEventListener('click', () => removeTodo(index));

        actions.appendChild(toggleButton);
        actions.appendChild(removeButton);
        li.appendChild(text);
        li.appendChild(actions);
        list.appendChild(li);
      });
    }

    function addTodo(text) {
      if (!text.trim()) return;
      todos.push({ text: text.trim(), completed: false });
      input.value = '';
      renderTodos();
    }

    function toggleTodo(index) {
      todos[index].completed = !todos[index].completed;
      renderTodos();
    }

    function removeTodo(index) {
      todos.splice(index, 1);
      renderTodos();
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      addTodo(input.value);
    });

    renderTodos();
  </script>
</body>
</html>
