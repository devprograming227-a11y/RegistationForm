<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>User Registration</title>
  <style>
    :root{--bg:#f4f6f8;--card:#fff;--primary:#0078d4}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .card{background:var(--card);padding:22px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.06);width:100%;max-width:520px}
    h1{margin:0 0 14px;font-size:1.3rem}
    form{display:grid;gap:12px}
    label{font-size:.9rem;color:#333}
    input[type="text"],input[type="email"],input[type="password"]{width:100%;padding:10px 12px;border:1px solid #dcdfe3;border-radius:8px;font-size:1rem}
    .row{display:flex;gap:12px}
    .error{color:#c92a2a;font-size:.86rem}
    .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
    button{background:var(--primary);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer}
    button.secondary{background:#e6eefb;color:var(--primary)}
    pre{background:#f6f8fa;padding:10px;border-radius:6px;overflow:auto}
    .success{background:#e6ffef;border:1px solid #b7f0cb;padding:10px;border-radius:6px;color:#06633a}
  </style>
</head>
<body>
  <div class="card">
    <h1>Create an account</h1>
    <form id="register-form" novalidate>
      <div>
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" required />
        <div class="error" id="err-fullName"></div>
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <div class="error" id="err-email"></div>
      </div>
      <div class="row">
        <div style="flex:1">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required />
          <div class="error" id="err-password"></div>
        </div>
        <div style="flex:1">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" required />
          <div class="error" id="err-confirm"></div>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="secondary" id="show-users">Show stored users</button>
        <button type="submit">Register</button>
      </div>
    </form>

    <div id="message" style="margin-top:12px"></div>
    <div id="stored" style="margin-top:12px"></div>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const message = document.getElementById('message');
    const stored = document.getElementById('stored');

    function qs(id){return document.getElementById(id)}

    function clearErrors(){['fullName','email','password','confirm'].forEach(id=>qs('err-'+id).textContent='')}

    function validate(data){
      clearErrors();
      let ok=true;
      if(!data.fullName || data.fullName.trim().length<2){qs('err-fullName').textContent='Please enter your full name.';ok=false}
      const emailRe=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
      if(!emailRe.test(data.email)){qs('err-email').textContent='Please enter a valid email.';ok=false}
      if(!data.password || data.password.length<6){qs('err-password').textContent='Password must be at least 6 characters.';ok=false}
      if(data.password!==data.confirm){qs('err-confirm').textContent='Passwords do not match.';ok=false}
      return ok;
    }

    function loadUsers(){
      try{return JSON.parse(localStorage.getItem('users')||'[]')}
      catch(e){return []}
    }

    function saveUser(user){
      const users=loadUsers();
      users.push(user);
      localStorage.setItem('users', JSON.stringify(users));
    }

    form.addEventListener('submit', e=>{
      e.preventDefault();
      message.innerHTML='';
      stored.innerHTML='';
      const data={
        fullName: qs('fullName').value,
        email: qs('email').value,
        password: qs('password').value,
        confirm: qs('confirm').value
      };
      if(!validate(data)) return;
      const user={name:data.fullName, email:data.email, createdAt:new Date().toISOString()};
      saveUser(user);
      message.innerHTML='<div class="success">Registration successful.</div>';
      form.reset();
    });

    document.getElementById('show-users').addEventListener('click', ()=>{
      const users = loadUsers();
      if(!users.length){stored.innerHTML='<pre>(no users stored)</pre>';return}
      const lines = users.map(u=>`${u.name} <${u.email}> — ${u.createdAt}`);
      stored.innerHTML=`<pre>${lines.join('\n')}</pre>`;
    });
  </script>
</body>
</html>
